<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: app shell — fixed sidebar on desktop, bottom tab bar on phones; ledger-style tables. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --sunk:#e9ebe7; --line:#d7dad4; --fg:#1d2522; --muted:#5f6a65;
  --accent:#0f5c4d; --accent-fg:#ffffff; --accent-soft:#dcebe6; --copper:#b2652a;
  --good:#1d7a45; --warn:#a86a00; --bad:#b3322a; --good-soft:#e1f1e6; --warn-soft:#f8ecd2; --bad-soft:#f6dedb;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --panel:#1a211e; --sunk:#222b27; --line:#2f3a35; --fg:#e7ece9; --muted:#9aa7a1;
  --accent:#4fb39b; --accent-fg:#0b1513; --accent-soft:#1d3a33; --copper:#d98d4f;
  --good:#5cc489; --warn:#e0a63a; --bad:#ef7a70; --good-soft:#18352a; --warn-soft:#3a2f17; --bad-soft:#3d201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1a211e; --sunk:#222b27; --line:#2f3a35; --fg:#e7ece9; --muted:#9aa7a1;
  --accent:#4fb39b; --accent-fg:#0b1513; --accent-soft:#1d3a33; --copper:#d98d4f;
  --good:#5cc489; --warn:#e0a63a; --bad:#ef7a70; --good-soft:#18352a; --warn-soft:#3a2f17; --bad-soft:#3d201d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
nav.side{background:var(--panel);border-inline-start:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:40px;height:40px;object-fit:cover;border-radius:8px;background:#0c0c0c;color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.brand b{font-family:var(--display);font-size:17px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:var(--r);cursor:pointer;text-align:start;color:var(--muted);font-weight:500}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn:hover{background:var(--sunk);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px}
body.login .mobilebar{display:none}
body.login .app{grid-template-columns:1fr}
body.login nav.side{display:none}
main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:17px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{color:var(--muted);font-size:13px}
.tile .v{font-family:var(--display);font-size:22px;font-weight:600}
.tile .s{font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12px;text-align:start;padding:9px 12px;background:var(--sunk);white-space:nowrap;letter-spacing:.02em}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
td.n,th.n{text-align:end}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--sunk);color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f>span{font-weight:500}
.sk-grid{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.sk-grid{grid-template-columns:1fr}}
.sk-prev{padding:8px;background:#fff}.sk-prev svg{display:block;width:100%;height:auto}
#homeai svg{width:22px;height:22px;color:var(--accent,#c47a2c);flex:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:40;display:flex;justify-content:flex-start}
.drawer{background:var(--panel);width:min(860px,100%);height:100%;overflow:auto;padding-block:20px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;box-shadow:0 0 40px rgba(0,0,0,.2)}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:calc(-20px);background:var(--panel);padding-block:8px;z-index:2;border-bottom:1px solid var(--line)}
.drawer > *{flex-shrink:0}
@media (max-width:640px){
 .lines thead{display:none}
 .lines,.lines tbody{display:block;width:100%}
 .lines tr{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-bottom:1px solid var(--line);align-items:end}
 .lines td{display:block;padding:0;flex:1;min-width:0;border:0}
 .lines td:first-child{flex-basis:100%}
 .lines td.del{flex:0 0 34px}
 .lines td[data-h]::before{content:attr(data-h);display:block;font-size:11px;color:var(--muted,#888);margin-bottom:2px}
 .drawer .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .drawer .dh{flex-wrap:wrap}
}
.lines td{padding:6px 6px}
.lines input{padding:6px 8px}
.lines td.del{width:34px}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.totals{display:grid;grid-template-columns:auto auto;gap:6px 24px;justify-content:end;font-size:15px}
.totals .big{font-family:var(--display);font-size:20px;font-weight:700}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:var(--r);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;z-index:60;font-size:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted)}
.copper{color:var(--copper)}
.mobilebar{display:none}
.thumb{width:48px;height:48px;border-radius:6px;object-fit:cover;background:var(--sunk);display:block}
.pimg{width:100%;max-width:340px;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk)}
.ref{font-size:12px;color:var(--copper)}
.chipline{display:flex;flex-wrap:wrap;gap:6px}
.chipline span{background:var(--sunk);border-radius:6px;padding:2px 8px;font-size:12px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  .grid2{grid-template-columns:1fr}
  .mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow-x:auto}
  .mobilebar .navbtn{flex-direction:column;gap:2px;font-size:11px;padding:8px 6px;min-width:64px;align-items:center;border-radius:0}
  .tile .v{font-size:19px}
  h1{font-size:21px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(-30px);opacity:.6}}}

</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="الأقسام"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<nav class="mobilebar" id="mob" aria-label="الأقسام"></nav>
<div id="layer"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
// ---------- helpers ----------
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>{n=r2(n);return n.toLocaleString("en-US",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})};
const usd=n=>`<span class="num">$${fmt(n)}</span>`;
const lbp=n=>`<span class="num">${Math.round(n).toLocaleString("en-US")} ل.ل</span>`;
const today=()=>new Date().toISOString().slice(0,10);
const monthStart=()=>today().slice(0,8)+"01";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let toastT;
function toast(msg){let t=$("#toastEl");if(!t){t=document.createElement("div");t.id="toastEl";t.className="toast";document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

const ICON={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 sale:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 buy:'<path d="M3 4h2l2 12h11l2-8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/>',
 box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
 people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 5a3 3 0 0 1 0 6M18 14.5c2 .6 3.2 2.5 3.5 5.5"/>',
 cash:'<rect x="2.5" y="6" width="19" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.6"/>',
 chart:'<path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/>',
 pen:'<path d="M3 21h4L19 9l-4-4L3 17z"/><path d="M14 6l4 4"/><path d="M3 21l18 0" opacity=".35"/>',
 spark:'<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4.6 15H4.5a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.1a2 2 0 1 1 0 4z"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

const VIEWS=[["home","الرئيسية","home"],["ai","المساعد الذكي","spark"],["sketch","الرسومات","pen"],["sales","المبيعات","sale"],["purchases","المشتريات","buy"],["products","المخزون","box"],["parties","الزباين والموردين","people"],["cash","الصندوق والمصاريف","cash"],["reports","التقارير","chart"],["settings","الإعدادات","gear"]];

// ---------- state ----------
const S={products:[],parties:[],invoices:[],vouchers:[],sketches:[],settings:{company:"MADI Kitchen Equipment",companyAr:"ماضي لتجهيز المطابخ",phone:"+961 71 786 303",address:"Lebanon",website:"madiequipment.com",invoiceNotes:"",rate:89500,openingCash:0,expenseCats:["إيجار","رواتب","كهربا ومولد","نقل وتوصيل","صيانة","جمارك وشحن","مصاريف متفرقة"]},
  ready:{products:false,parties:false,invoices:false,vouchers:false,sketches:false},canWrite:true,db:null,dl:null,offline:false};
let view=(location.hash||"").replace("#","")||"home"; if(!VIEWS.some(v=>v[0]===view)) view="home";
let ui={q:"",filter:"all",from:monthStart(),to:today(),partyType:"customer"};

// ---------- computations ----------
const prodById=id=>S.products.find(p=>p.id===id);
const partyById=id=>S.parties.find(p=>p.id===id);
const live=inv=>inv.status!=="cancelled";
const invSub=inv=>r2((inv.lines||[]).reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0));
const invDisc=inv=>inv.discountPct?r2(invSub(inv)*(+inv.discount||0)/100):r2(+inv.discount||0);
const invCharges=inv=>r2((inv.charges||[]).reduce((a,c)=>a+(+c.amount||0),0));
const invVat=inv=>(+inv.vatPct||0)?r2((invSub(inv)-invDisc(inv)+invCharges(inv))*(+inv.vatPct)/100):0;
const invTotal=inv=>r2(invSub(inv)-invDisc(inv)+invCharges(inv)+invVat(inv));
const invCost=inv=>r2((inv.lines||[]).reduce((a,l)=>a+(+l.qty||0)*(+l.cost||0),0));
function stock(pid){
  const p=prodById(pid); let q=+(p&&p.openQty)||0;
  for(const inv of S.invoices){ if(!live(inv)||inv.type==="quote") continue;
    for(const l of inv.lines||[]) if(l.pid===pid) q+= inv.type==="purchase"? (+l.qty||0) : -(+l.qty||0); }
  return q;
}
function partyBal(pid){
  const p=partyById(pid); if(!p) return 0; let b=+p.opening||0;
  for(const inv of S.invoices){ if(!live(inv)||inv.partyId!==pid||inv.type==="quote") continue;
    if(inv.type===(p.type==="supplier"?"purchase":"sale")) b+=invTotal(inv)-(+inv.paid||0); }
  for(const v of S.vouchers){ if(v.partyId!==pid) continue;
    if(p.type==="customer"&&v.kind==="receipt") b-=+v.usd||0;
    if(p.type==="supplier"&&v.kind==="payment") b-=+v.usd||0; }
  return r2(b);
}
function cashFlows(from,to){ // list of {date,label,in,out,ref}
  const L=[]; const inR=d=>(!from||d>=from)&&(!to||d<=to);
  for(const inv of S.invoices){ if(!live(inv)||inv.type==="quote"||!(+inv.paid)) continue; if(!inR(inv.date)) continue;
    const pn=(partyById(inv.partyId)||{}).name||"نقدي";
    if(inv.type==="sale") L.push({date:inv.date,label:`دفعة مع فاتورة بيع ${inv.no} · ${pn}`,in:+inv.paid,out:0});
    else L.push({date:inv.date,label:`دفعة مع فاتورة شراء ${inv.no} · ${pn}`,in:0,out:+inv.paid}); }
  for(const v of S.vouchers){ if(!inR(v.date)) continue; const pn=(partyById(v.partyId)||{}).name;
    const lab={receipt:`قبض من ${pn||"زبون"}`,payment:`دفع لـ ${pn||"مورد"}`,expense:`مصروف · ${v.category||""}`,income:`إيراد آخر · ${v.category||""}`}[v.kind]+(v.note?` · ${v.note}`:"");
    const inn=v.kind==="receipt"||v.kind==="income"; L.push({date:v.date,label:lab,in:inn?+v.usd:0,out:inn?0:+v.usd,v}); }
  return L.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function cashBalance(upto){ let b=+S.settings.openingCash||0; for(const f of cashFlows(null,upto)) b+=f.in-f.out; return r2(b); }
function pnl(from,to){
  const inR=d=>d>=from&&d<=to; let sales=0,cogs=0,exp=0,inc=0; const byCat={};
  for(const inv of S.invoices) if(live(inv)&&inv.type==="sale"&&inR(inv.date)){sales+=invTotal(inv);cogs+=invCost(inv)}
  for(const v of S.vouchers) if(inR(v.date)){ if(v.kind==="expense"){exp+=+v.usd||0;byCat[v.category||"أخرى"]=(byCat[v.category||"أخرى"]||0)+(+v.usd||0)} if(v.kind==="income") inc+=+v.usd||0; }
  return {sales:r2(sales),cogs:r2(cogs),gross:r2(sales-cogs),exp:r2(exp),inc:r2(inc),net:r2(sales-cogs-exp+inc),byCat};
}
function nextNo(type){ const pre={sale:"S",purchase:"P",quote:"Q"}[type]; let m=0;
  for(const i of S.invoices) if(i.type===type){const n=parseInt(String(i.no||"").replace(/\D/g,""),10); if(n>m)m=n;}
  return pre+"-"+String(m+1).padStart(4,"0"); }

// ---------- db (Supabase + offline cache) ----------
const COLS=["products","parties","invoices","vouchers","sketches"];
const CFG=window.MADI_CONFIG||{};
const Store={sb:null,user:null,idb:null,pending:0,online:navigator.onLine,syncing:false,lastSync:"",channel:null};
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("madi-accounts",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("docs");d.createObjectStore("outbox",{autoIncrement:true});d.createObjectStore("meta")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbTx(store,mode,fn){return new Promise((res,rej)=>{const t=Store.idb.transaction(store,mode);const s=t.objectStore(store);let out;try{out=fn(s)}catch(e){rej(e)}t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})}
const idbGetAll=(store)=>new Promise((res,rej)=>{const out=[];const t=Store.idb.transaction(store,"readonly");const c=t.objectStore(store).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push({key:cur.key,value:cur.value});cur.continue()}else res(out)};c.onerror=()=>rej(c.error)});
function applyDoc(col,id,data,deleted){
  if(col==="config"){ if(id==="settings"&&!deleted&&data) S.settings={...S.settings,...data}; return; }
  if(!COLS.includes(col)) return;
  const arr=S[col]; const i=arr.findIndex(x=>x.id===id);
  if(deleted){ if(i>=0) arr.splice(i,1); return; }
  const d={...data,id}; if(i>=0) arr[i]=d; else arr.push(d);
}
async function loadLocal(){
  for(const {value:v} of await idbGetAll("docs")) applyDoc(v.col,v.id,v.data,v.deleted);
  Store.lastSync=(await idbTx("meta","readonly",s=>s.get("lastSync")))||"";
  Store.pending=(await idbGetAll("outbox")).length;
  COLS.forEach(c=>S.ready[c]=true);
}
let rerenderT; function softRender(){clearTimeout(rerenderT);rerenderT=setTimeout(()=>{ const a=document.activeElement; const typing=a&&a.closest&&a.closest("#view")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName); if(!$("#scrim")&&!typing) render(); else renderNav(); },120)}
async function save(col,obj){
  if(!S.canWrite){toast("ما عندك صلاحية تعديل.");return false}
  const id=obj.id||uid(); const body={...obj,id,updatedAt:new Date().toISOString()};
  applyDoc(col,id,body,false);
  await idbTx("docs","readwrite",s=>s.put({col,id,data:body,deleted:false},col+"/"+id));
  await idbTx("outbox","readwrite",s=>s.add({col,id,data:body,deleted:false}));
  Store.pending++; softRender(); push(); return true;
}
async function remove(col,id){
  applyDoc(col,id,null,true);
  await idbTx("docs","readwrite",s=>s.put({col,id,data:{},deleted:true},col+"/"+id));
  await idbTx("outbox","readwrite",s=>s.add({col,id,data:{},deleted:true}));
  Store.pending++; softRender(); push(); return true;
}
async function push(){
  if(!Store.sb||!Store.user||!navigator.onLine||Store.pushing) return;
  Store.pushing=true;
  try{
    for(;;){
      const items=(await idbGetAll("outbox")).slice(0,200); if(!items.length) break;
      const latest=new Map(); for(const it of items) latest.set(it.value.col+"/"+it.value.id,it.value);
      const rows=[...latest.values()].map(v=>({collection:v.col,id:v.id,data:v.data,deleted:v.deleted}));
      const {error}=await Store.sb.from("docs").upsert(rows,{onConflict:"collection,id"});
      if(error) throw error;
      await idbTx("outbox","readwrite",s=>{for(const it of items) s.delete(it.key)});
      Store.pending=(await idbGetAll("outbox")).length;
    }
  }catch(e){ console.warn("push failed",e); if(e&&(e.code==="42501"||/row-level security|permission/i.test(e.message||""))){S.canWrite=false;toast("السيرفر رفض الحفظ. تأكد إنك عامل تسجيل دخول.")} }
  Store.pushing=false; softRender();
}
async function pull(){
  if(!Store.sb||!Store.user||!navigator.onLine) return;
  Store.syncing=true; softRender();
  try{
    let from=Store.lastSync||"1970-01-01T00:00:00Z", got;
    do{
      const {data,error}=await Store.sb.from("docs").select("collection,id,data,deleted,updated_at").gt("updated_at",from).order("updated_at",{ascending:true}).limit(1000);
      if(error) throw error; got=data||[];
      if(got.length){
        await idbTx("docs","readwrite",s=>{for(const r of got) s.put({col:r.collection,id:r.id,data:r.data,deleted:r.deleted},r.collection+"/"+r.id)});
        for(const r of got) applyDoc(r.collection,r.id,r.data,r.deleted);
        from=got[got.length-1].updated_at; Store.lastSync=from; await idbTx("meta","readwrite",s=>s.put(from,"lastSync"));
      }
    }while(got.length===1000);
  }catch(e){ console.warn("pull failed",e); }
  Store.syncing=false; softRender();
}
function subscribeLive(){
  if(Store.channel||!Store.sb) return;
  Store.channel=Store.sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},async(p)=>{
    const r=p.new; if(!r||!r.collection) return;
    await idbTx("docs","readwrite",s=>s.put({col:r.collection,id:r.id,data:r.data,deleted:r.deleted},r.collection+"/"+r.id));
    applyDoc(r.collection,r.id,r.data,r.deleted);
    if(r.updated_at>Store.lastSync){Store.lastSync=r.updated_at;idbTx("meta","readwrite",s=>s.put(r.updated_at,"lastSync"))}
    softRender();
  }).subscribe();
}
async function syncNow(){ await push(); await pull(); }
window.addEventListener("online",()=>{Store.online=true;syncNow();softRender()});
window.addEventListener("offline",()=>{Store.online=false;softRender()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") syncNow()});
function handleErr(e){ toast("صار خطأ. جرّب مرة تانية."); console.warn(e); }
function syncBadge(){
  if(!navigator.onLine) return `<span class="pill warn">بلا إنترنت${Store.pending?` · ${Store.pending} بانتظار الرفع`:""}</span>`;
  if(Store.pending) return `<span class="pill warn">عم يرفع ${Store.pending}…</span>`;
  if(Store.syncing) return `<span class="pill mute">عم يحدّث…</span>`;
  return `<span class="pill good">محفوظ أونلاين</span>`;
}
// ---------- files ----------
function downloadFile(name,content,mime){
  const blob=content instanceof Blob?content:new Blob([content],{type:mime||"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function printHtml(html){
  const f=document.createElement("iframe");f.style.cssText="position:fixed;width:0;height:0;border:0;left:-9999px";document.body.appendChild(f);
  f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){downloadFile("print.html",html,"text/html")}setTimeout(()=>f.remove(),60000)};
  f.srcdoc=html;
}

function statusPill(i){
  if(i.status==="cancelled") return `<span class="pill mute">ملغاة</span>`;
  if(i.type==="quote") return `<span class="pill mute">عرض سعر</span>`;
  const t=invTotal(i),p=+i.paid||0;
  if(p>=t-0.009) return `<span class="pill good">مدفوعة</span>`;
  if(p>0) return `<span class="pill warn">مدفوع جزء</span>`;
  return `<span class="pill bad">دين</span>`;
}

  function sync(){ inv.partyId=$("#party").value; inv.date=$("#date").value||today(); inv.no=$("#no").value.trim()||inv.no; inv.discount=+$("#disc").value||0; if($("#paid")) inv.paid=+$("#paid").value||0; inv.notes=$("#notes").value;

          if((p.variants||[]).length){l.vi=0;const v=p.variants[0];l.name=p.nameAr+" — "+v.label;if(!isPur)l.price=+v.price||0;}} else {l.pid="";l.base="";delete l.vi;} }

    $("#toinv")&&($("#toinv").onclick=()=>{sync();inv.type="sale";inv.no=nextNo("sale");draw();toast("صارت فاتورة بيع. اكبس حفظ لتثبت.")});
    document.querySelectorAll("[data-exp]").forEach(b=>b.onclick=()=>{sync();exportInvoice(inv,b.dataset.exp)});
    $("#saveinv").onclick=async()=>{
      sync(); inv.lines=inv.lines.filter(l=>l.name.trim()||(+l.price));
      if(!inv.lines.length){toast("زيد سطر واحد عالأقل");inv.lines.push({pid:"",name:"",qty:1,price:0,cost:0});draw();return}
      if(isPur&&!inv.partyId){toast("اختار المورد قبل الحفظ");return}
      if(S.invoices.some(i=>i.id!==inv.id&&i.type===inv.type&&i.no===inv.no)){toast("رقم الفاتورة مستعمل. غيّرو.");return}
      if(!inv.partyId&&(+inv.paid||0)<invTotal(inv)-0.009&&inv.type==="sale"){toast("الزبون النقدي لازم يدفع كامل. اختار زبون إذا في دين.");return}
      inv.total=invTotal(inv);
      inv.charges=inv.charges.filter(c=>(+c.amount)||(c.label&&!CHL[c.label]&&+c.amount));
      if(await save("invoices",inv)){ draftClear(); closeLayer(); toast("انحفظت الفاتورة "+inv.no);
        if(isPur){ for(const l of inv.lines){ const p=l.pid&&prodById(l.pid); if(p&&(+l.price)&&+p.cost!==+l.price){ await save("products",{...p,cost:+l.price}); } } } }
    };
  }

}

// ---------- INVOICE: print / PDF / share (canvas pages, no external library) ----------
const IV={W:1654,H:2339,M:120};
const hasAr=t=>/[؀-ۿ]/.test(String(t||""));
function ivText(x,t,X,Y,font,color,align){ x.font=font; x.fillStyle=color||"#111"; x.textAlign=align||"left"; x.direction=hasAr(t)?"rtl":"ltr"; x.fillText(String(t??""),X,Y); }

const ivMoney=v=>(Math.round((+v||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const ivDate=d=>{const [y,m,dd]=String(d||"").split("-");return dd?`${dd}/${m}/${y}`:String(d||"")};
let LOGO_IMG=null;
async function ivLogo(){ if(LOGO_IMG) return LOGO_IMG; try{ const i=new Image(); i.src="icons/logo-word.jpg"; await i.decode(); LOGO_IMG=i; }catch(e){} return LOGO_IMG; }
function ivLineInfo(l){
  const p=l.pid&&prodById(l.pid); const v=p&&l.vi!=null&&(p.variants||[])[l.vi];
  const title=(p&&p.nameEn)?p.nameEn:(l.base||l.name||"");
  const det=[v?v.label:"", p&&p.nameEn?(l.base||p.nameAr):"", l.det||""].filter(Boolean).join(" · ");
  return {title,det};
}
async function invoicePages(inv){
  const st=S.settings, p=partyById(inv.partyId)||{}, logo=await ivLogo();
  const {W,H,M}=IV; const pages=[]; let c,x,y;
  const docTitle={sale:"INVOICE",purchase:"PURCHASE INVOICE",quote:"QUOTATION"}[inv.type]||"INVOICE";
  const noTxt="#"+(String(inv.no||"").replace(/^\D+-?/,"")||inv.no);
  const cols={desc:M, qty:W-M-640, price:W-M-330, amt:W-M}; // qty/price/amount are right-aligned anchors
  const newPage=(first)=>{
    c=document.createElement("canvas"); c.width=W; c.height=H; x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,W,H); pages.push(c);
    y=M;
    if(logo){ const lh=110, lw=logo.naturalWidth*lh/logo.naturalHeight; x.drawImage(logo,M,y-10,Math.min(lw,420),lh); }
    ivText(x,docTitle,W-M,y+40,"700 64px Helvetica, Arial, sans-serif","#111","right");
    ivText(x,noTxt,W-M,y+92,"400 30px Helvetica, Arial, sans-serif","#666","right");
    y+=140;
    ivText(x,st.company||"Madi Kitchen Equipment",M,y,"700 40px Helvetica, Arial, sans-serif");
    ivText(x,"Issued "+ivDate(inv.date),W-M,y,"400 28px Helvetica, Arial, sans-serif","#444","right");
    y+=40; x.fillStyle="#111"; x.fillRect(M,y,W-2*M,4); y+=70;
    if(first){
      const half=(W-2*M)/2;
      ivText(x,"FROM",M,y,"700 24px Helvetica, Arial, sans-serif","#888"); ivText(x,inv.type==="purchase"?"SUPPLIER":"BILL TO",M+half,y,"700 24px Helvetica, Arial, sans-serif","#888");
      y+=46;
      const from=[st.company||"Madi Kitchen Equipment",st.phone,st.address,st.website].filter(Boolean);
      const to=[p.name||(inv.type==="purchase"?"—":"Cash customer"),p.phone,p.address].filter(Boolean);
      for(let i=0;i<Math.max(from.length,to.length);i++){ const f=i===0?"700 30px Helvetica, Arial, sans-serif":"400 28px Helvetica, Arial, sans-serif";
        if(from[i]) ivText(x,from[i],M,y,f,i?"#444":"#111"); if(to[i]) ivText(x,to[i],M+half,y,f,i?"#444":"#111"); y+=42; }
      y+=40;
    }
    // table head
    x.fillStyle="#f1f1f1"; x.fillRect(M,y,W-2*M,64);
    const hf="700 24px Helvetica, Arial, sans-serif";
    ivText(x,"DESCRIPTION",cols.desc+20,y+42,hf,"#555"); ivText(x,"QTY",cols.qty,y+42,hf,"#555","right");
    ivText(x,"PRICE USD",cols.price,y+42,hf,"#555","right"); ivText(x,"AMOUNT USD",cols.amt-20,y+42,hf,"#555","right");
    y+=64;
  };
  const newPagePlain=()=>{ c=document.createElement("canvas"); c.width=W; c.height=H; x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,W,H); pages.push(c); y=M; };
  newPage(true);
  const descW=cols.qty-cols.desc-140;
  for(const l of inv.lines||[]){
    const {title,det}=ivLineInfo(l);
    const tl=ivWrap(x,title,descW,"700 30px Helvetica, Arial, sans-serif"), dl=det?ivWrap(x,det,descW,"400 25px Helvetica, Arial, sans-serif"):[];
    const rh=30+tl.length*40+dl.length*34+24;
    if(y+rh>H-M-260){ newPage(false); }
    let yy=y+46;
    tl.forEach((t,i)=>ivText(x,t,cols.desc+20,yy+i*40,"700 30px Helvetica, Arial, sans-serif"));
    yy+=tl.length*40-6; dl.forEach((t,i)=>ivText(x,t,cols.desc+20,yy+i*34,"400 25px Helvetica, Arial, sans-serif","#888"));
    const nf="400 30px Helvetica, Arial, sans-serif";
    ivText(x,fmt(l.qty),cols.qty,y+46,nf,"#111","right"); ivText(x,ivMoney(l.price),cols.price,y+46,nf,"#111","right"); ivText(x,ivMoney((+l.qty||0)*(+l.price||0)),cols.amt-20,y+46,nf,"#111","right");
    y+=rh; x.fillStyle="#e3e3e3"; x.fillRect(M,y-2,W-2*M,2);

  if(y>H-M-520) newPage(false);
  y+=20; const lab=cols.price-160;

  const chs=(inv.charges||[]).filter(c=>+c.amount);
  if(disc||chs.length||vat) trow("Subtotal","$"+ivMoney(sub));
  if(disc) trow(inv.discountPct?`Discount (${fmt(inv.discount)}%)`:"Discount","-$"+ivMoney(disc));
  for(const c of chs) trow(CHE[c.label]||c.label||"Extra","$"+ivMoney(c.amount));
  if(vat) trow(`VAT (${fmt(inv.vatPct)}%)`,"$"+ivMoney(vat));
  x.fillStyle="#111"; x.fillRect(lab-260,y+6,cols.amt-lab+260,3); y+=10;
  trow("Total","$"+ivMoney(total),true);
  if(inv.type==="sale"&&(+inv.paid||0)>0){ trow("Paid","$"+ivMoney(inv.paid)); const due=r2(total-(+inv.paid||0)); trow("Balance due","$"+ivMoney(due),false,due>0.009?"#b42318":"#111"); }
  ivText(x,"≈ "+fmt(Math.round(total*rate()))+" LBP  (rate "+fmt(rate())+")",cols.amt-20,y+26,"400 22px Helvetica, Arial, sans-serif","#999","right"); y+=50;
  // notes
  const valid=inv.type==="quote"&&(+inv.validDays)?`This quotation is valid for ${+inv.validDays} days.`:"";
  const notes=[inv.notes,valid,st.invoiceNotes].filter(x=>String(x||"").trim()).join("\n");
  if(notes){
    const nl=ivWrap(x,notes,W-2*M,"400 27px Helvetica, Arial, sans-serif");
    if(y+90+nl.length*40>H-M-60) newPage(false);
    y+=50; ivText(x,"NOTES & PAYMENTS INSTRUCTIONS",M,y,"700 26px Helvetica, Arial, sans-serif","#555"); y+=48;
    nl.forEach(t=>{ ivText(x,t,hasAr(t)?W-M:M,y,"400 27px Helvetica, Arial, sans-serif","#333",hasAr(t)?"right":"left"); y+=40; });
  }

  if(sk){ try{ const blob=await sketchPNG(sk.spec); const img=new Image(); img.src=URL.createObjectURL(blob); await img.decode();
      newPagePlain(); const maxW=W-2*M, maxH=H-2*M-120; const sc=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight);
      ivText(x,"DRAWING",M,M+30,"700 30px Helvetica, Arial, sans-serif","#555");
      x.drawImage(img,M+(maxW-img.naturalWidth*sc)/2,M+60,img.naturalWidth*sc,img.naturalHeight*sc); URL.revokeObjectURL(img.src); }catch(e){} }

    if(pages.length>1) ivText(g,`Page ${i+1} of ${pages.length}`,W-M,H-M+56,"400 24px Helvetica, Arial, sans-serif","#888","right"); });
  return pages;
}
// minimal PDF writer: one full-page JPEG per page
async function pagesToPDF(pages){

  const re=/(\d+(?:\.\d+)?)\s*(متر|امتار|م|سم|سنتي|cm|m)?\s*(?:عرض\s*)?(?:بـ?|على)\s*(\d+(?:\.\d+)?)\s*(متر|امتار|م|سم|cm|m)?/g; let m, main=null; const sinkPairs=[];

  else { const lm=t.match(/(?:طول\s*)?(\d+(?:\.\d+)?)\s*(متر|امتار|م|سم)(?=\s|$)/); if(lm){ sp.length=cm(lm[1],lm[2],6); ok=true; }

function skReadForm(){

function bindSketch(){

  const upd=()=>{skReadForm(); $("#skprev").innerHTML=sketchSVG(SK.spec); skPersist();};
  document.querySelectorAll("[data-sk],[data-sks]").forEach(el=>{el.oninput=upd; if(el.dataset.sk==="kind") el.onchange=()=>{skReadForm();render()};});

    if(await save("sketches",{id:SK.id,title:s.title,customer:s.customer,spec:SK.spec})) toast("انحفظت الرسمة");};
  $("#skform")&&($("#skform").ontoggle=e=>{SK.showForm=e.target.open});
  $("#skai").onclick=async()=>{ const d=$("#skdesc").value.trim(); if(!d){toast("اكتب وصف أول");return}

    SK.busy=true; SK.status=loc.ok?"رسمتها. المساعد عم يحسّنها…":"المساعد عم يرسم…"; render();

    SK.busy=false; skPersist(); render(); };
  document.querySelectorAll("[data-skopen]").forEach(r=>r.onclick=e=>{ if(e.target.closest("[data-skrm]")) return; const k=(S.sketches||[]).find(x=>x.id===r.dataset.skopen); if(k){SK.spec=JSON.parse(JSON.stringify(k.spec||skDefaults()));SK.id=k.id;render();window.scrollTo(0,0)} });

const normAr=s=>String(s||"").toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآا]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي");
const SYN={"براد":["ثلاجه","fridge","refrigerator"],"ثلاجه":["براد"],"فريزر":["freezer"],"غريل":["griddle","grill","شوايه"],"شوايه":["grill","غريل"],"قلايه":["fryer"],"فرن":["oven"],"عجانه":["mixer","خفاقه"],"سخان":["warmer"],"عصاره":["juicer"],"كيك":["cake"],"طاوله":["table"],"غاز":["gas","burner"]};
function searchProducts(q,limit=12){
  const toks=normAr(q).split(/[\s،,]+/).filter(t=>t.length>1);
  const scored=S.products.map(p=>{
    const hay=normAr([p.nameAr,p.nameEn,p.cat,p.brand,p.code,(p.variants||[]).map(v=>v.label).join(" ")].join(" "));
    let s=0; for(const t of toks){ if(hay.includes(t)) s+=2; else if((SYN[t]||[]).some(x=>hay.includes(normAr(x)))) s+=1.5; else if(/^\d+$/.test(t)&&hay.includes(t)) s+=1; }
    return [s,p];
  }).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,limit);
  return scored.map(([s,p])=>({code:p.code||p.id,id:p.id,name:p.nameAr,nameEn:p.nameEn,category:p.cat,brand:p.brand,price:+p.price||0,cost:+p.cost||0,stock:stock(p.id),
    sizes:(p.variants||[]).map(v=>({label:v.label,price:+v.price||0})),specs:String(p.notes||"").slice(0,220)}));
}
function findParty(name,type){
  const n=normAr(name).trim(); if(!n) return null;
  const list=S.parties.filter(p=>!type||p.type===type);
  return list.find(p=>normAr(p.name)===n)||list.find(p=>normAr(p.name).includes(n)||n.includes(normAr(p.name)))||null;
}
function partiesWithBalance(type,min){
  return S.parties.filter(p=>p.type===type).map(p=>({name:p.name,phone:p.phone||"",balance:partyBal(p.id),lastInvoice:(S.invoices.filter(i=>i.partyId===p.id&&live(i)&&i.type!=="quote").map(i=>i.date).sort().pop())||null}))
    .filter(x=>x.balance>=(+min||0.01)).sort((a,b)=>b.balance-a.balance).slice(0,40);
}
function reportData(from,to){
  const p=pnl(from,to); const top={};
  for(const inv of S.invoices) if(live(inv)&&inv.type==="sale"&&inv.date>=from&&inv.date<=to) for(const l of inv.lines||[]){const k=l.name;top[k]=top[k]||{qty:0,sales:0,profit:0};top[k].qty+=+l.qty||0;top[k].sales+=(+l.qty||0)*(+l.price||0);top[k].profit+=(+l.qty||0)*((+l.price||0)-(+l.cost||0))}
  const cnt=S.invoices.filter(i=>live(i)&&i.type==="sale"&&i.date>=from&&i.date<=to).length;
  return {from,to,salesInvoices:cnt,sales:p.sales,costOfGoods:p.cogs,grossProfit:p.gross,expenses:p.exp,otherIncome:p.inc,netProfit:p.net,expensesByCategory:p.byCat,
    topProducts:Object.entries(top).sort((a,b)=>b[1].sales-a[1].sales).slice(0,10).map(([n,o])=>({name:n,qty:o.qty,sales:r2(o.sales),profit:r2(o.profit)})),
    note:p.cogs===0&&p.sales>0?"سعر الكلفة مش معبّى لكتير منتجات، فالربح ممكن يطلع أعلى من الحقيقي":undefined};
}
function invoicesList(from,to,type,partyName){
  const pid=partyName?(findParty(partyName)||{}).id:null;
  return S.invoices.filter(i=>(!type||i.type===type)&&(!from||i.date>=from)&&(!to||i.date<=to)&&(!partyName||i.partyId===pid))
    .sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40)
    .map(i=>({no:i.no,date:i.date,type:i.type,party:(partyById(i.partyId)||{}).name||"نقدي",total:invTotal(i),paid:+i.paid||0,status:i.status==="cancelled"?"ملغاة":"",items:(i.lines||[]).map(l=>`${l.qty}× ${l.name}`).join("، ")}));
}
function lowStock(){ return S.products.filter(p=>(+p.minQty||0)>0&&stock(p.id)<=(+p.minQty||0)).map(p=>({name:p.nameAr,stock:stock(p.id),min:+p.minQty})); }

 {name:"prepare_invoice",description:"بيحضّر مسودة فاتورة (ما بتنحفظ) وبيفتحها للمستخدم ليراجعها ويحفظها بنفسو. لازم تكون عملت search_products قبل وتستعمل الكود الصحيح. إذا المنتج إلو مقاسات، حط size بنفس اسم المقاس. price اختياري (إذا ما انذكر بينحط سعر المقاس). إذا ما في منتج مطابق بالكتالوج، استعمل name بدل code (خدمة أو منتج مش موجود).",

];
function buildDraft(i){
  const type=["sale","purchase","quote"].includes(i.type)?i.type:"sale"; const isPur=type==="purchase";
  const party=i.party?findParty(String(i.party),isPur?"supplier":"customer"):null;
  const lines=[]; const issues=[];
  for(const l of (Array.isArray(i.lines)?i.lines:[])){
    const p=l.code?S.products.find(x=>x.code===String(l.code)||x.id===String(l.code)):null;
    const qty=+l.qty||1;
    if(p){ let vi, v; if((p.variants||[]).length){ const sz=normAr(l.size||""); vi=p.variants.findIndex(x=>normAr(x.label)===sz); if(vi<0&&sz) vi=p.variants.findIndex(x=>normAr(x.label).includes(sz)||sz.includes(normAr(x.label))); if(vi<0){vi=0; if(l.size) issues.push(`ما لقيت مقاس "${l.size}" لـ ${p.nameAr}، حطيت أول مقاس`);} v=p.variants[vi]; }
      const def=isPur?(+p.cost||0):(v?+v.price:(+p.price||0));
      lines.push({pid:p.id,base:p.nameAr,name:v?p.nameAr+" — "+v.label:p.nameAr,vi,qty,price:l.price!=null&&!isNaN(+l.price)?+l.price:def,cost:+p.cost||0}); }
    else { lines.push({pid:"",name:String(l.name||l.code||"بند"),qty,price:+l.price||0,cost:0}); if(l.code) issues.push(`الكود ${l.code} مش موجود، حطيتو كسطر حر`); }
  }
  if(!lines.length) throw new Error("ما في أسطر بالفاتورة");
  const total=r2(lines.reduce((a,l)=>a+l.qty*l.price,0)-(+i.discount||0)+(+i.delivery||0)+(+i.installation||0));
  AI.draft={type,partyId:party?party.id:"",partyName:i.party?String(i.party):"",newParty:!!(i.party&&!party),lines,paid:Math.min(+i.paid||0,total),discount:+i.discount||0,delivery:+i.delivery||0,installation:+i.installation||0,notes:String(i.notes||"")};
  AI.setStatus("حضّرت مسودة الفاتورة");
  return {ok:true,total,party:party?party.name:(i.party?`"${i.party}" مش موجود بالزباين، المستخدم لازم يزيدو`:"زبون نقدي"),lines:lines.map(l=>`${l.qty}× ${l.name} @ $${l.price}`),issues};
}

function aiErrMsg(e){
  const m=String((e&&e.message)||e||"");
  if(m==="offline") return "المساعد بدو إنترنت. جرّب لما يرجع النت.";
  if(m==="no_backend") return "المساعد بيشتغل بس لما التطبيق يكون موصول بـ Supabase.";
  if(m==="no_key") return "لازم تحط مفتاح المساعد بـ Supabase أول (شوف ملف AI-SETUP بالـ GitHub).";
  if(/all_gemini_failed/.test(m)&&/limit: 0/.test(m)) return "حساب Gemini تبعك ما إلو حد مجاني. زيد مفتاح Groq المجاني (شوف الخطوات بملف AI-SETUP).";
  if(/all_gemini_failed|all_groq_failed/.test(m)) return "كل الموديلات المجانية مشغولة أو خلص حدها هلق. جرّب بعد دقيقة.";
  if(/quota|RESOURCE_EXHAUSTED|exceeded/i.test(m)) return "خلص الحد المجاني هلق. استنى دقيقة وجرّب، وإذا ما زبط بيرجع بكرا.";
  if(/API key not valid|API_KEY_INVALID/i.test(m)) return "مفتاح Gemini غلط. حطّو من جديد بـ Supabase.";
  if(/not available in your country|location is not supported|FAILED_PRECONDITION/i.test(m)) return "Google ما عم تسمح بالخدمة المجانية من هالمنطقة. منجرّب حل تاني.";
  if(m==="no_function") return "لازم تنشر دالة المساعد (ai) على Supabase أول.";
  if(m==="not_signed_in") return "لازم تعمل تسجيل دخول من جديد.";
  if(/credit|billing|balance/i.test(m)) return "الرصيد بحساب Anthropic خلص. اشحن من console.anthropic.com.";
  if(/authentication|api.key|x-api-key/i.test(m)) return "مفتاح Anthropic غلط. حطّو من جديد بـ Supabase.";
  if(/overloaded|rate/i.test(m)) return "الخدمة مضغوطة هلق. جرّب بعد دقيقة.";
  if(m==="aborted") return "";
  if(m==="timeout") return "المساعد ما ردّ خلال دقيقة. روح عالإعدادات واكبس فحص المساعد لنعرف السبب.";
  return "صار خطأ بالمساعد: "+m.slice(0,140);
}
// token straight from the saved session, so the call never waits on the library's internal lock
async function aiToken(){
  try{ const ref=new URL(CFG.url).hostname.split(".")[0]; const raw=localStorage.getItem(`sb-${ref}-auth-token`);
    if(raw){ const o=JSON.parse(raw); const sess=o.currentSession||o; if(sess&&sess.access_token&&(!sess.expires_at||sess.expires_at*1000>Date.now()+30000)) return sess.access_token; } }catch(_){}
  try{ const r=await Promise.race([Store.sb.auth.getSession(),new Promise(res=>setTimeout(()=>res(null),4000))]); const t=r&&r.data&&r.data.session&&r.data.session.access_token; if(t) return t; }catch(_){}
  try{ const r=await Promise.race([Store.sb.auth.refreshSession(),new Promise(res=>setTimeout(()=>res(null),6000))]); const t=r&&r.data&&r.data.session&&r.data.session.access_token; if(t) return t; }catch(_){}
  throw new Error("not_signed_in");
}
async function aiCall(body){
  if(!navigator.onLine) throw new Error("offline");
  if(!Store.sb) throw new Error("no_backend");
  const token=await aiToken();
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),55000);
  let r; try{ r=await fetch(CFG.url.replace(/\/+$/,"")+"/functions/v1/ai",{method:"POST",signal:ctl.signal,
      headers:{"Authorization":"Bearer "+token,"apikey":CFG.key,"content-type":"application/json"},body:JSON.stringify(body)}); }
  catch(e){ throw new Error(e&&e.name==="AbortError"?"timeout":"network: "+(e&&e.message||e)); }
  finally{ clearTimeout(tm); }
  let data=null; try{ data=await r.json(); }catch(_){}
  if(!r.ok){ if(r.status===404&&!(data&&data.error)) throw new Error("no_function");
    const m=data&&(data.error||data.message||data.msg); const det=data&&Array.isArray(data.details)?" | "+data.details.join(" | "):""; throw new Error((typeof m==="string"?m:(m&&(m.message||m.type))||("http "+r.status))+det); }
  if(data&&data.type==="error") throw new Error((data.error&&data.error.message)||"error");
  return data;
}
// runs the tool loop locally: the model asks for a tool, the app runs it on its own data and sends the result back
async function aiRun(system,history,tools,opts){
  opts=opts||{}; const msgs=history.slice(); let text="";
  for(let step=0;step<8;step++){
    if(AI.cancel) throw new Error("aborted");
    if(step) AI.setStatus("عم كمّل… (خطوة "+(step+1)+")");
    const res=await aiCall({system,messages:msgs,tools:tools?toolDefs(tools):undefined,tool_choice:opts.tool_choice,max_tokens:opts.max_tokens||2500});
    const blocks=res.content||[]; msgs.push({role:"assistant",content:blocks});
    const t=blocks.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim(); if(t) text=t;
    const uses=blocks.filter(b=>b.type==="tool_use");
    if(res.stop_reason!=="tool_use"||!uses.length) break;
    const results=[];
    for(const u of uses){ const tool=(tools||[]).find(x=>x.name===u.name); let out, err=false;
      try{ out=tool?await tool.execute(u.input||{}):{error:"unknown tool"}; }catch(e){ out={error:String(e.message||e)}; err=true; }
      results.push({type:"tool_result",tool_use_id:u.id,content:JSON.stringify(out).slice(0,30000),is_error:err||undefined}); }
    if(opts.stopAfterTool) return {text,msgs};
    msgs.push({role:"user",content:results});
  }
  return {text,msgs};
}

  const p=id?{...partyById(id)}:{type:type||ui.partyType,name:prefName||"",phone:"",address:"",opening:0,notes:""};
  let confirmDel=false;
  function statement(){
    const rows=[]; if(+p.opening) rows.push({date:"",label:"رصيد افتتاحي",dr:+p.opening,cr:0});
    for(const inv of S.invoices){ if(!live(inv)||inv.partyId!==id||inv.type==="quote") continue;
      if(p.type==="customer"&&inv.type==="sale"){rows.push({date:inv.date,label:"فاتورة بيع "+inv.no,dr:invTotal(inv),cr:0,inv:inv.id}); if(+inv.paid) rows.push({date:inv.date,label:"دفعة مع الفاتورة "+inv.no,dr:0,cr:+inv.paid});}
      if(p.type==="supplier"&&inv.type==="purchase"){rows.push({date:inv.date,label:"فاتورة شراء "+inv.no,dr:invTotal(inv),cr:0,inv:inv.id}); if(+inv.paid) rows.push({date:inv.date,label:"دفعة مع الفاتورة "+inv.no,dr:0,cr:+inv.paid});} }
    for(const v of S.vouchers) if(v.partyId===id&&(v.kind==="receipt"||v.kind==="payment")) rows.push({date:v.date,label:(v.kind==="receipt"?"قبض":"دفع")+(v.note?" · "+v.note:""),dr:0,cr:+v.usd||0});

    <div class="fgrid">
     <label class="f"><span>الاسم *</span><input type="text" id="pname" value="${esc(p.name)}"></label>
     <label class="f"><span>التلفون</span><input type="tel" id="pphone" value="${esc(p.phone)}" dir="ltr"></label>
     <label class="f"><span>المنطقة / العنوان</span><input type="text" id="paddr" value="${esc(p.address)}"></label>
     <label class="f"><span>رصيد افتتاحي $ ${p.type==="customer"?"(دين قديم عليه)":"(دين قديم إلو)"}</span><input type="number" step="any" id="popen" class="num" value="${p.opening||0}"></label>
     <label class="f" style="grid-column:1/-1"><span>ملاحظات</span><textarea id="pnotes2">${esc(p.notes||"")}</textarea></label>
    </div>
    ${id?`<div class="tiles"><div class="tile"><span class="k">${p.type==="customer"?"عليه لإلنا":"إلو علينا"}</span><span class="v ${bal>0.009?"copper":""}">${usd(bal)}</span><span class="s">${lbp(bal*rate())}</span></div></div>
     <div class="row"><button class="btn pri sm" data-newv="${p.type==="customer"?"receipt":"payment"}" data-vparty="${id}">${p.type==="customer"?"+ قبض منه":"+ دفع إلو"}</button><button class="btn sm" data-new="${p.type==="customer"?"sale":"purchase"}" data-iparty="${id}">+ فاتورة جديدة</button></div>
     <div class="card"><div class="ch"><h2>كشف الحساب</h2></div>${st.length?`<div class="scroll"><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="n">مدين</th><th class="n">دائن</th><th class="n">الرصيد</th></tr></thead><tbody>${st.map(r=>`<tr ${r.inv?`class="click" data-inv="${r.inv}"`:""}><td class="num">${r.date||"—"}</td><td>${esc(r.label)}</td><td class="n">${r.dr?usd(r.dr):""}</td><td class="n">${r.cr?usd(r.cr):""}</td><td class="n">${usd(r.bal)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">ما في حركة لسا.</div>`}</div>`:""}
    ${confirmDel?`<div class="confirm"><span>أكيد؟ الفواتير بتضل بس بتصير بلا اسم.</span><button class="btn danger sm" id="delyes">إيه، احذف</button><button class="btn sm" id="delno">لا</button></div>`:""}
    <div class="row" style="justify-content:space-between"><div>${id?`<button class="btn danger sm" id="del">حذف</button>`:""}</div><button class="btn pri" id="saveparty" ${S.canWrite?"":"disabled"}>حفظ</button></div>

async function exportStatement(p,rows){
  const st=S.settings; const html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>كشف حساب ${esc(p.name)}</title><style>body{font-family:Tahoma,Arial,sans-serif;margin:32px;font-size:14px}table{width:100%;border-collapse:collapse}th{background:#0f5c4d;color:#fff;padding:7px;text-align:right}td{padding:7px;border-bottom:1px solid #ddd}.n{text-align:left;direction:ltr}</style></head><body><h2>${esc(st.companyAr||"")} · كشف حساب</h2><p><b>${esc(p.name)}</b> ${esc(p.phone||"")} · لتاريخ ${today()}</p><table><thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.date||"—"}</td><td>${esc(r.label)}</td><td class=n>${r.dr?"$"+fmt(r.dr):""}</td><td class=n>${r.cr?"$"+fmt(r.cr):""}</td><td class=n>$${fmt(r.bal)}</td></tr>`).join("")}</tbody></table><p><b>الرصيد النهائي: $${fmt(rows.length?rows[rows.length-1].bal:0)}</b> (${Math.round((rows.length?rows[rows.length-1].bal:0)*rate()).toLocaleString("en-US")} ل.ل)</p></body></html>`;
  printHtml(html);
}

  const rows=fl.map(f=>{b+=f.in-f.out;return {...f,bal:b}}).reverse();
  const tin=fl.reduce((a,f)=>a+f.in,0), tout=fl.reduce((a,f)=>a+f.out,0);

function prevDay(d){const x=new Date(d);x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)}
function openVoucher(id,kind,partyId){
  const v=id?{...S.vouchers.find(x=>x.id===id)}:{kind,date:today(),partyId:partyId||"",amount:0,cur:"USD",rate:rate(),usd:0,category:"",method:"كاش",note:""};
  let confirmDel=false;
  const titles={receipt:"قبض من زبون",payment:"دفع لمورد",expense:"مصروف",income:"إيراد آخر"};
  function draw(){
    const needParty=v.kind==="receipt"||v.kind==="payment"; const pt=v.kind==="receipt"?"customer":"supplier";
    const parties=S.parties.filter(p=>p.type===pt).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
    const bal=v.partyId?partyBal(v.partyId):0;
    $("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="drawer" role="dialog" aria-label="${titles[v.kind]}" style="width:min(560px,100%)">
    <div class="dh"><h2>${titles[v.kind]}</h2><button class="x" id="close" aria-label="سكّر">×</button></div>
    <div class="fgrid">
     ${needParty?`<label class="f" style="grid-column:1/-1"><span>${pt==="customer"?"الزبون":"المورد"} *</span><select id="vparty"><option value="">اختار</option>${parties.map(p=>`<option value="${p.id}" ${p.id===v.partyId?"selected":""}>${esc(p.name)}</option>`).join("")}</select>${v.partyId?`<small class="muted">الرصيد الحالي: $${fmt(bal)}</small>`:""}</label>`
       :`<label class="f" style="grid-column:1/-1"><span>البند</span><input type="text" id="vcat" list="vcats" value="${esc(v.category)}" placeholder="إيجار، رواتب، نقل…"><datalist id="vcats">${(S.settings.expenseCats||[]).map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>`}
     <label class="f"><span>المبلغ *</span><input type="number" step="any" min="0" id="vamt" class="num" value="${v.amount||""}"></label>
     <label class="f"><span>العملة</span><select id="vcur"><option value="USD" ${v.cur==="USD"?"selected":""}>دولار $</option><option value="LBP" ${v.cur==="LBP"?"selected":""}>ليرة ل.ل</option></select></label>
     ${v.cur==="LBP"?`<label class="f"><span>سعر الصرف</span><input type="number" id="vrate" class="num" value="${v.rate}"></label>`:""}
     <label class="f"><span>التاريخ</span><input type="date" id="vdate" value="${v.date}"></label>
     <label class="f"><span>طريقة الدفع</span><select id="vmeth">${["كاش","تحويل","شيك","OMT / Whish"].map(m=>`<option ${v.method===m?"selected":""}>${m}</option>`).join("")}</select></label>
     <label class="f" style="grid-column:1/-1"><span>ملاحظة</span><input type="text" id="vnote" value="${esc(v.note)}"></label>
    </div>
    <div class="totals"><span>بالدولار</span><span class="big" id="vusd">${usd(calcUsd())}</span></div>
    ${confirmDel?`<div class="confirm"><span>أكيد بدك تحذفو؟</span><button class="btn danger sm" id="delyes">إيه، احذف</button><button class="btn sm" id="delno">لا</button></div>`:""}
    <div class="row" style="justify-content:space-between"><div>${id?`<button class="btn danger sm" id="del">حذف</button>`:""}</div><button class="btn pri" id="savev" ${S.canWrite?"":"disabled"}>حفظ</button></div></div></div>`;
    $("#close").onclick=closeLayer; $("#scrim").onclick=e=>{if(e.target.id==="scrim")closeLayer()};
    const rd=()=>{ if($("#vparty"))v.partyId=$("#vparty").value; if($("#vcat"))v.category=$("#vcat").value.trim(); v.amount=+$("#vamt").value||0; v.cur=$("#vcur").value; if($("#vrate"))v.rate=+$("#vrate").value||rate(); v.date=$("#vdate").value||today(); v.method=$("#vmeth").value; v.note=$("#vnote").value.trim(); };
    $("#vcur").onchange=()=>{rd();draw()}; $("#vparty")&&($("#vparty").onchange=()=>{rd();draw()});
    $("#vamt").oninput=()=>{rd();$("#vusd").innerHTML=usd(calcUsd())}; $("#vrate")&&($("#vrate").oninput=()=>{rd();$("#vusd").innerHTML=usd(calcUsd())});
    $("#del")&&($("#del").onclick=()=>{rd();confirmDel=true;draw()}); $("#delno")&&($("#delno").onclick=()=>{confirmDel=false;draw()});
    $("#delyes")&&($("#delyes").onclick=async()=>{if(await remove("vouchers",id)){closeLayer();toast("انحذف")}});
    $("#savev").onclick=async()=>{ rd(); if(needParty&&!v.partyId){toast("اختار الجهة");return} if(!(v.amount>0)){toast("اكتب المبلغ");return}
      if(!needParty&&!v.category){toast("اكتب البند");return} v.usd=calcUsd();
      if(await save("vouchers",v)){closeLayer();toast("انحفظ")} };
  }
  function calcUsd(){return r2(v.cur==="LBP"?(+v.amount||0)/(+v.rate||rate()):(+v.amount||0))}
  draw();
}

function vReports(){
  const p=pnl(ui.from,ui.to);

  const tops=Object.entries(top).sort((a,b)=>b[1].s-a[1].s).slice(0,10); const maxS=tops.length?tops[0][1].s:1;
  const cats=Object.entries(p.byCat).sort((a,b)=>b[1]-a[1]);
  const inv=S.products.map(x=>({x,s:stock(x.id)})).filter(o=>o.s>0); const invVal=inv.reduce((a,o)=>a+o.s*(+o.x.cost||0),0), invSale=inv.reduce((a,o)=>a+o.s*(+o.x.price||0),0);
  const margin=p.sales?Math.round(p.gross/p.sales*100):0;
  return `<div class="head"><div><h1>التقارير</h1><p class="sub">الأرباح والخسائر، أكتر شي مبيع، والمصاريف</p></div><button class="btn" id="backup">نسخة احتياطية (JSON)</button></div>

   <div class="seg">${[["m","هالشهر"],["y","هالسنة"],["all","من الأول"]].map(([k,l])=>`<button data-range="${k}">${l}</button>`).join("")}</div></div>

    <tr><td>المبيعات</td><td class="n">${usd(p.sales)}</td></tr>
    <tr><td>ناقص: كلفة البضاعة المبيوعة</td><td class="n">${usd(-p.cogs)}</td></tr>
    <tr><td><b>الربح الإجمالي</b> <span class="muted">(هامش ${margin}%)</span></td><td class="n"><b>${usd(p.gross)}</b></td></tr>
    <tr><td>ناقص: المصاريف</td><td class="n">${usd(-p.exp)}</td></tr>
    <tr><td>زائد: إيرادات تانية</td><td class="n">${usd(p.inc)}</td></tr>
    <tr><td><b style="font-family:var(--display);font-size:16px">صافي الربح</b></td><td class="n"><b style="font-family:var(--display);font-size:18px;color:${p.net>=0?"var(--good)":"var(--bad)"}">${usd(p.net)}</b><div class="muted">${lbp(p.net*rate())}</div></td></tr>
   </tbody></table></div></div>
  <div class="grid2">
   <div class="card"><div class="ch"><h2>أكتر شي مبيع</h2></div>${tops.length?`<div style="padding:12px 16px;display:flex;flex-direction:column;gap:12px">${tops.map(([n,o])=>`<div><div class="row" style="justify-content:space-between"><span>${esc(n)} <span class="muted num">×${fmt(o.q)}</span></span><span>${usd(o.s)} <span class="muted" style="font-size:12px">ربح ${usd(o.pr)}</span></span></div><div class="bar"><i style="width:${Math.max(2,o.s/maxS*100)}%"></i></div></div>`).join("")}</div>`:`<div class="empty">ما في مبيعات بهالفترة.</div>`}</div>
   <div class="card"><div class="ch"><h2>المصاريف حسب البند</h2></div>${cats.length?`<div class="scroll"><table><tbody>${cats.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="n">${usd(v)}</td><td class="n muted num" style="width:60px">${Math.round(v/p.exp*100)}%</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">ما في مصاريف بهالفترة.</div>`}</div>
  </div>
  <div class="tiles"><div class="tile"><span class="k">قيمة المخزون بالكلفة</span><span class="v">${usd(invVal)}</span></div><div class="tile"><span class="k">قيمة المخزون بسعر البيع</span><span class="v">${usd(invSale)}</span><span class="s">ربح متوقع ${usd(invSale-invVal)}</span></div><div class="tile"><span class="k">رصيد الصندوق</span><span class="v">${usd(cashBalance(today()))}</span></div></div>`;
}

async function importDocs(col,docs){
  if(!docs.length) return 0; const now=new Date().toISOString();
  await idbTx("docs","readwrite",s=>{for(const d of docs) s.put({col,id:d.id,data:{...d,updatedAt:d.updatedAt||now},deleted:false},col+"/"+d.id)});
  await idbTx("outbox","readwrite",s=>{for(const d of docs) s.add({col,id:d.id,data:{...d,updatedAt:d.updatedAt||now},deleted:false})});
  for(const d of docs) applyDoc(col,d.id,d,false);
  Store.pending=(await idbGetAll("outbox")).length; return docs.length;
}
async function importCatalog(){
  try{
    const r=await fetch("seed/catalog.json",{cache:"no-store"}); const list=await r.json();
    const fresh=list.filter(p=>!prodById(p.id));
    const n=await importDocs("products",fresh); render(); push();
    toast(n?`انزاد ${n} منتج من كتالوج العبدالله`:"الكتالوج موجود من قبل");
  }catch(e){toast("ما قدرت حمّل الكتالوج. تأكد من الإنترنت.")}
}
function importBackupFile(file){
  const rd=new FileReader();
  rd.onload=async()=>{ try{
      const d=JSON.parse(rd.result); let n=0;
      for(const c of COLS) if(Array.isArray(d[c])) n+=await importDocs(c,d[c].filter(x=>x&&x.id));
      if(d.settings) await save("config",{...d.settings,id:"settings"});
      render(); push(); toast(`انزاد ${n} سجل من النسخة الاحتياطية`);
    }catch(e){toast("الملف مش نسخة احتياطية صحيحة")} };
  rd.readAsText(file);
}
async function saveSettingsDoc(s){ S.settings={...S.settings,...s}; return save("config",{...s,id:"settings"}); }

render();
(async()=>{
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{}); }catch(e){}
  try{ Store.idb=await idbOpen(); await loadLocal(); }catch(e){ console.warn("local storage unavailable",e); COLS.forEach(c=>S.ready[c]=true); }
  if(!CFG.url||!CFG.key||!window.supabase){ S.noBackend=true; render(); return; }
  Store.sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await Store.sb.auth.getSession(); Store.user=data&&data.session?data.session.user:null;
  Store.sb.auth.onAuthStateChange((_ev,sess)=>{ const was=!!Store.user; Store.user=sess?sess.user:null; if(Store.user&&!was){subscribeLive();syncNow()} render(); });
  if(Store.user){ subscribeLive(); syncNow(); }
  render();
})();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
var installEvt=null; window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;softRender()});

window.MADI={sketchPNG,sketchSVG,invoicePages,pagesToPDF,S,importCatalog,Store,aiSend,AI,parseSketchText};
})();
</script>
